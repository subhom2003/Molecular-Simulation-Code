[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lj_md_package"
version = "0.2.0"
description = "LAMMPS-style Lennard-Jones molecular dynamics simulator in pure Python"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Subhomoy", email = "subhomoy@example.com"},
]
keywords = ["molecular dynamics", "lennard-jones", "lammps", "simulation"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Physics",
    "Intended Audience :: Science/Research",
]

dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
test = ["pytest>=7.4"]
dev = ["pytest>=7.4", "ruff>=0.1", "build>=1.0"]
plot = ["matplotlib>=3.7"]

[project.scripts]
lj-md = "lj_md_package.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["lj_md_package*"]
exclude = ["tests*", "examples*", "docs*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
